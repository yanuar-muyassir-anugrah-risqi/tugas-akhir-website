<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XYVER Stats Viewer - International">
  <title>XYVER — Stats Viewer - International</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="icon1.png">
</head>

<body>
  <header class="navbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="./icon1.png" alt="XYVER Logo">

      <span class="brand-copy">
        <strong>XYVER</strong>
        <small>Stats Viewer - International</small>
      </span>
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#levels">Demon List</a>
      <a href="index.html#community">Community</a>
      <a class="active" href="players.html">Stats Viewer</a>
    </nav>

    <div class="nav-actions">
      <a class="login-button" href="login.html">Login</a>
    </div>
  </header>

  <main class="page-layout stats-page-layout">

    <aside class="empty-column"></aside>

    <section class="main-column">

      <section class="levels-panel">

        <div class="levels-heading">

          <div class="section-heading compact">
            <img src="iconplayer.png" alt="" class="level-list-icon">

            <div>
              <h2>Top <span>15 Players</span></h2>
              <p>Player leaderboard ranking</p>
            </div>
          </div>

          <div class="level-tools">
            <input
              id="player-search"
              type="search"
              placeholder="Search player..."
              aria-label="Search player"
            >
          </div>

        </div>

        <section class="level-details panel" id="player-details">

          <button
            class="details-toggle"
            id="player-details-toggle"
            type="button"
            aria-expanded="false"
          >
            Player Information
          </button>

          <div
            class="details-content"
            id="player-details-content"
            hidden
          >
            <div id="player-information">
              <p>Select a player to view their information.</p>
            </div>
          </div>

        </section>


        <div class="level-list" id="player-list-full"></div>

        <div class="pagination">

          <button id="prev-player-page" type="button">
            ‹
          </button>

          <span id="player-page-label">Page 1 / 15</span>

          <button id="next-player-page" type="button">
            ›
          </button>

        </div>

      </section>

    </section>

    <aside class="empty-column"></aside>

  </main>


  <footer class="footer">
    <span>© 2026 XYVER</span>
    <span>Fan-made concept • Not affiliated with RobTop Games</span>
  </footer>


  <script src="players-data.js"></script>
  <script src="players.js"></script>

</body>
</html>
